<div class="on-dark flex min-h-screen flex-col
            bg-[url('/assets/img/backgrounds/juego1.jpg')] bg-cover bg-center bg-fixed">

  <app-game-header [timeLeft]="timer.remaining()" [localScore]="localScore()" levelLabel="Kids · Nivel 1 de 3" />

  <div class="hsv-card mx-auto my-5 flex w-[calc(100%-2rem)] max-w-[62.5rem] flex-col gap-5 p-6">

    <div class="flex flex-col items-center gap-2 text-center">
      <h1 class="m-0 text-[clamp(1.35rem,4vw,1.9rem)] text-balance text-ink">
        Lleva cada nombre a su dibujo
      </h1>
      <!-- La instruccion sigue el estado en vez de ser un cartel fijo: asi el
           modo tactil se descubre solo. -->
      <p class="m-0 min-h-7 text-lg font-bold transition-colors"
         [class]="selection.selected() ? 'text-brand' : 'text-ink-soft'"
         aria-live="polite">
        {{ selection.selected() ? 'Ahora toca el dibujo que le corresponde' : 'Toca un nombre para empezar' }}
      </p>
    </div>

    <!-- Nombres arriba: es lo primero que hay que tocar, y en tablet la mano
         tapa la mitad inferior de la pantalla. -->
    <div class="flex flex-wrap justify-center gap-3">
      @for (name of shuffledNames(); track name) {
        <button
          type="button"
          class="min-h-tapbtn rounded-full border-4 px-5 font-display text-lg transition"
          [class]="selection.isSelected(name)
            ? 'border-brand bg-brand text-white -translate-y-1 scale-105 shadow-lift'
            : 'border-transparent bg-slate-100 text-ink shadow-md hover:scale-105'"
          draggable="true"
          (dragstart)="onDragStart($event, name)"
          (dragend)="onDragEnd()"
          (click)="onLabelTap(name)"
          [attr.aria-pressed]="selection.isSelected(name)">
          {{ name }}
        </button>
      } @empty {
        <p class="m-0 text-lg font-extrabold text-win">¡Emparejaste todo! 🎉</p>
      }
    </div>

    <div class="grid grid-cols-[repeat(auto-fit,minmax(6.5rem,1fr))] gap-4">
      @for (item of items(); track item.id) {
        <button
          type="button"
          class="relative flex aspect-square items-center justify-center rounded-2xl border-4 p-2 transition"
          [class]="item.matched
            ? 'border-win bg-win/15 cursor-default'
            : (selection.selected() !== null
                ? 'border-brand bg-brand/10 animate-target-pulse'
                : 'border-slate-200 bg-slate-50')"
          [disabled]="item.matched"
          (dragover)="onDragOver($event)"
          (drop)="onDrop($event, item)"
          (click)="onTargetTap(item)"
          [attr.aria-label]="item.matched ? item.name + ' emparejado' : 'Colocar aquí'">
          <!-- alt vacio: el nombre ya lo da el aria-label del boton. -->
          <img [src]="item.src" alt="" width="100" height="100" loading="lazy" decoding="async"
               class="size-full object-contain">
          @if (item.matched) {
            <span class="absolute -top-2.5 -right-2.5 flex size-7 items-center justify-center
                         rounded-full bg-win text-sm text-white shadow-md" aria-hidden="true">✓</span>
            <span class="absolute inset-x-1 bottom-1 truncate rounded bg-win px-1 text-center
                         font-body text-[0.7rem] font-extrabold text-white">{{ item.name }}</span>
          }
        </button>
      }
    </div>

    <div class="flex justify-center">
      <button type="button" class="hsv-btn hsv-btn-ghost !text-ink !border-slate-300" (click)="restart()">
        🔄 Reiniciar juego
      </button>
    </div>
  </div>
</div>
