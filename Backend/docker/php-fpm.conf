; Pool de php-fpm afinado para los planes chicos de Render (512MB RAM).
[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Los logs van al stdout del contenedor para que Render los capture.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
