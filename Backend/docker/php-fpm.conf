; Pool de php-fpm afinado para los planes chicos de Render (512MB RAM).
[www]
listen = 127.0.0.1:9000

; Bajado de 10 a 6: el contenedor ya no solo corre nginx + php-fpm, tambien
; Reverb y el latido del estado. En un plan gratuito de 512MB, 10 workers de FPM
; a ~35MB cada uno mas los dos procesos nuevos se pasan del limite, y el OOM
; killer se lleva por delante lo que le toque. Para dos endpoints y un canal de
; estado, 6 workers sobran.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Los logs van al stdout del contenedor para que Render los capture.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
