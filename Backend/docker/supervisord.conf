; supervisord mantiene vivos los cuatro procesos del contenedor de produccion.
;
; Reparto de responsabilidades:
;   nginx      atiende HTTP y proxia /ws
;   php-fpm    ejecuta la aplicacion
;   reverb     sostiene las conexiones WebSocket del canal de estado
;   heartbeat  emite el estado por ese canal cada 25s
;
; Reverb va aparte de php-fpm por necesidad: FPM asigna un worker por peticion y
; lo mantiene ocupado hasta que responde, asi que no puede sostener conexiones
; largas. Reverb es asincrono y aguanta muchas en un solo proceso.
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
; El puerto sale del entorno: el entrypoint lo desplaza si choca con $PORT.
command=sh -c 'exec php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=${REVERB_SERVER_PORT:-8080}'
user=www-data
autostart=true
autorestart=true
priority=30
; startsecs: si se cae antes de estos segundos, supervisord lo considera un
; arranque fallido en vez de reiniciarlo en bucle sin fin.
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:heartbeat]
command=php /var/www/html/artisan status:heartbeat --interval=25
user=www-data
autostart=true
autorestart=true
; priority mas alta que reverb para que arranque despues: si emite antes de que
; Reverb acepte conexiones, el primer latido se pierde. El comando ya lo tolera
; (avisa y reintenta), pero asi no ensucia los logs del arranque.
priority=40
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
